<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON</title>
</head>

<body>
    <h2>JSON in JavaScript.</h2>
    <p>Convert a JavaScript object into a JSON string and convert it to the server</p>
    <p id="result"></p>
    <script>
        var myObj = { name: "Manha", age: "13", grade: "7" };
        var myJSON = JSON.stringify(myObj);
        var newObj = JSON.parse(myJSON);

        document.getElementById("result").innerHTML = newObj.name;
    </script>
</body>

</html>
