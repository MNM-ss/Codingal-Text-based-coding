<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>

<body>
    <h2>JS arrow function</h2>
    <p>(Arrow function with a parameter)</p>

    <p id="result"></p>

    <script>
        const add = (a, b) => a + b;

        document.getElementById("result").innerHTML = add(4, 6);
    </script>
</body>

</html>
