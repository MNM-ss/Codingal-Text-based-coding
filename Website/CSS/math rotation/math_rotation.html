<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Rotation</title>
    <style>
        div {
            height: 300px;
            width: 300px;
            background-color: cadetblue;
            border: 3px solid rgb(129, 65, 65);
        }

        #mydiv {
            transform: rotateX(180deg)
        }
    </style>
</head>

<body>

    <div>Hello I'm Manha!</div>
    <div id="mydiv">
        Hello I'm Manha!
    </div>

</body>

</html>
