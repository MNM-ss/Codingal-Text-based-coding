<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group the form fields</title>
</head>

<body>
    <form>
        <fieldset>
            <center>
                <legend>
                    <h1>~✨ Add your info! ✨~<h1></h1>
                </legend>
            </center>
            <label><b><em>Your Name:</b></em></label><br><br>
            <input type="text"><br><br>
            <label><b><em>Your Birthday </b></em>🎂 :</label><br><br>
            <input type="date">
        </fieldset>
    </form>

</body>

</html>
