<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAsic Function</title>
</head>

<body>
    <button onclick="myfunction(5, 1, 2)">Execute JS function</button>

    <script>
        function myfunction(x, y, z) {
            if (z == undefined) {
                z = 2;
            }
            document.write(x * y * z);
        }
    </script>
</body>

</html>
