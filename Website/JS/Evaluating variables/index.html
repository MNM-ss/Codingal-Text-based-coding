<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluating variables</title>
</head>

<body>
    <p>Click the button to evaluate/execute the javascript code/function.</p>
    <button onclick="myFunction()">Try it!</button>
    <p id="result"></p>
    <script>
        function myFunction() {
            var x = 100;
            var y = 20;

            var a = eval(x + y) + "<br>";
            var b = eval(2 * 5) + "<br>";
            var c = eval(x - y) + "<br>";

            var res = a + b + c; // cocantenates the string

            document.getElementById("result").innerHTML = res;
        }

    </script>
</body>

</html>
