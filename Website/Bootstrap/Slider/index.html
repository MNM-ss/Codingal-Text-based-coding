<!DOCTYPE html>
<html lang="en">

<head>
    <title>Precious Memories</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <style>
        body {
            background-color: #fdf6ec;
            font-family: Georgia, serif;
            padding: 40px 0;
        }

        h2 {
            text-align: center;
            font-size: 2.2rem;
            color: #3b2a1a;
            margin-bottom: 30px;
            font-style: italic;
            letter-spacing: 1px;
        }

        #myCarousel {
            max-width: 800px;
            margin: 0 auto;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(100, 60, 20, 0.18);
        }

        #myCarousel .item img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            display: block;
        }

        .carousel-indicators li {
            background-color: #c9a84c;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            border: none;
            margin: 0 5px;
            opacity: 0.5;
        }

        .carousel-indicators .active {
            opacity: 1;
        }

        .left.carousel-control,
        .right.carousel-control {
            background-image: none;
            width: 48px;
            height: 48px;
            top: 50%;
            transform: translateY(-50%);
            bottom: auto;
            background-color: rgba(58, 40, 20, 0.55);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: background-color 0.2s;
        }

        .left.carousel-control {
            left: 14px;
        }

        .right.carousel-control {
            right: 14px;
        }

        .left.carousel-control:hover,
        .right.carousel-control:hover {
            background-color: rgba(201, 168, 76, 0.85);
        }

        .glyphicon {
            font-size: 16px;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Precious Memories</h2>

        <div id="myCarousel" class="carousel slide" data-ride="carousel">

            <!-- Indicators -->
            <ol class="carousel-indicators">
                <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
                <li data-target="#myCarousel" data-slide-to="1"></li>
                <li data-target="#myCarousel" data-slide-to="2"></li>
            </ol>

            <!-- Wrapper for slides -->
            <div class="carousel-inner">
                <div class="item active">
                    <img src="pic.jpg" alt="Los Angeles" style="width:100%;">
                </div>
                <div class="item">
                    <img src="pic1.jpg" alt="Chicago" style="width:100%;">
                </div>
                <div class="item">
                    <img src="pic2.png" alt="New York" style="width:100%;">
                </div>
            </div>

            <!-- Left and right controls -->
            <a class="left carousel-control" href="#myCarousel" data-slide="prev">
                <span class="glyphicon glyphicon-chevron-left"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="right carousel-control" href="#myCarousel" data-slide="next">
                <span class="glyphicon glyphicon-chevron-right"></span>
                <span class="sr-only">Next</span>
            </a>

        </div>
    </div>
</body>

</html>
