<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Types</title>
</head>

<body>
    <h1>JavaScript Data Types!</h1>
    <script>
        var a = 8;
        var b = 10;
        var c = 10;
        var d = null;
        var e;
        document.write("Are a and b equal? : " + "<br>" + (a == b));
        document.write("<br>");
        document.write("Are b and c equal? : " + "<br>" + (c == b));
        document.write("<br>");
        document.write("The value of d is :" + "<br>" + d);
        document.write("<br>");
        document.write("The value of e is :" + "<br>" + e);

    </script>
</body>

</html>
