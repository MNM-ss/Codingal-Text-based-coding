<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum</title>
</head>

<body>
    <h2>Sum (JS Math Objects)</h2>
    <script>
        var A = Math.acos(-1);
        var B = Math.atan(.5);
        var C = Math.asin(1);
        var D = Math.abs(20);

        document.write(A + B + C + D)
    </script>

</body>

</html>
