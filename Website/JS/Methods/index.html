<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods</title>
</head>

<body>
    <h2>JavaScript String Methods</h2>
    <p>Basic methods</p>
    <script>
        var str = "aMaZiNg";
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith('i'));
        document.write("<br>");

        // Testing w/ methods in js-- returns true or false
        var str = "I learnt about Methods";
        var patt = new RegExp("about");
        var res = patt.test(str);
        document.write(res);
    </script>
</body>

</html>
