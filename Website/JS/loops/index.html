<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>

<body>
    <h2>Loops in JS</h2>
    <p id="demo"></p>
    <script>
        var fruits = ["Apples", "Oranges", "Mangos", "Bananas", "Grapes", "Strawberries"];
        var text = "";
        var i;
        for (i = 0; < fruits.length; i++) {
            text += fruits[i] + "<br>";

        }
        document.getElementById("demo").innerHTML = text;
    </script>
