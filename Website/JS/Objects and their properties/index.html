<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object and it's properties</title>
</head>

<body>

    <h2>JavaScript: Object and it's properties</h2>
    <p>There are two different ways of accessing an object.</p><br>
    <p>Firstly with .property (better option) and secondly ["property"]</p>
    <p id="demo"></p>

    <script>
        var person = {
            firstName: "Samantha",
            sirName: "Hansberry",
            age: 25,
            gender: "Female",

        };

        document.getElementById("demo").innerHTML = "I am " + person.firstName + " " + person.sirName + " and I'm a " + person.age + " year old " + person.gender + ".";
    </script>
</body>

</html>
