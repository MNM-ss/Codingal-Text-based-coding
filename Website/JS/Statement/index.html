<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statement</title>
</head>

<body>
    <h1>JavaScript Statement</h1>

    <p>A <b>JavaScript program</b> is a list of <b>statements</b> that are to be executed by the computer.</p><br>

    <p><b>Math problems</b></p>

    <p>X is 5 and z = x + y. Find y.</p>

    <p id="demo"></p>

    <script>
        var x, y, z; // statement no. 1
        var x = 5; // statement no. 2
        var y = 6; // statement no. 3
        var z = x + y; // statement no. 4


        document.getElementById("demo").innerHTML = "The value of z is " + z + ".";
    </script>
</body>

</html>
