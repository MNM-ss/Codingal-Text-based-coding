<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Here's a drop down!</title>
</head>

<body>
    <fieldset>
        <center>
            <legend>
                <h1>~ Enter your marks! ~</h1>
            </legend>
        </center>
        <oninput="x.values (parseInt(ml.value)+parseInt(m2.value)+parseInt(m).value)/3">

            <label>Name</label><br>
            <input type="text" id="name"><br><br>
            <label>Enter Marks</label><br>

            <select name="Subject" id="subject">
                <option value="Maths">Maths</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
            </select>
            <input type="number" id="m1" name="m1"><br><br>
            <select name="Subject2" id="subject2">
                <option value="Maths">Maths</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
            </select>
            <input type="number" id="m2" name="2"><br><br>
            <select name="Subject3" id="subject3">
                <option value="Maths">Maths</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
            </select>
            <input type="number" id="3" name="3"><br><br>
            Average: <output name="x" for="m1 m2 m3"></output>

    </fieldset>
</body>

</html>
