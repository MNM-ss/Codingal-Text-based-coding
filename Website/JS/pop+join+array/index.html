<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Let us do pop/join method with Array in JavaScript</h2>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo"></p>
    <p id="pop"></p>
    <p id="origin"></p>
    <p id="join"></p>
    <script>
        var colors = ["Red", "Orange", "Yellow", "Green", "Blue"];
        document.getElementById("demo").innerHTML = colors[4];
        document.getElementById("demo2").innerHTML = colors[1];
        document.getElementById("demo3").innerHTML = colors[0];

        document.getElementById("origin").innerHTML = colors;
        document.getElementById("join").innerHTML = colors.join(" * ");



    </script>
</body>

</html>
